<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Masnavī of Jalāl al-Dīn Rūmī — Book One</title>
<meta name="description" content="Jalāl al-Dīn Rūmī's Masnavī, Book One, in English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Amiri:ital,wght@0,400;0,700;1,400&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="starfield" aria-hidden="true"></div>

<!-- HERO -->
<header class="hero" id="hero">
  <p class="bismillah" lang="ar" dir="rtl" title="In the name of God, the Most Gracious, the Most Merciful">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</p>
  <div class="hero__center">
    <span class="eyebrow">Jalāl al-Dīn Rūmī</span>
    <h1 class="hero__title">The Masnavī<span class="sub">Book One</span></h1>
    <blockquote class="hero__verse">
      <span class="line">Listen to the reed, how it tells its tale,</span>
      <span class="line">complaining of separations — saying,</span>
      <span class="line">“Ever since I was cut from the reed-bed…”</span>
    </blockquote>
  </div>

  <div class="hero__bottom">
    <div class="hero__meta">
      <span><b id="stat-chapters">182</b> chapters</span>
    </div>
    <a class="enter" href="#contents" id="enterBtn">Read <span class="arrow">→</span></a>
  </div>
</header>

<!-- CONTENTS -->
<main class="contents is-hidden" id="contents">
  <div class="contents__head">
    <h2>The Masnavī, Book One</h2>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="tocSearch" placeholder="Search chapters…" aria-label="Search chapters">
    </label>
  </div>
  <div class="toc" id="toc"></div>
</main>

<!-- READER -->
<article class="reader is-hidden" id="reader">
  <div class="progress" id="progress"></div>
  <div class="reader__bar">
    <button class="navbtn" id="openDrawer" aria-label="Open chapter list" aria-haspopup="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span>Chapters</span>
    </button>
    <span class="brand" id="readerCrumb">The Masnavī · Book One</span>
    <a class="backlink" href="#contents" id="backBtn">Contents</a>
  </div>
  <div class="reader__body" id="readerBody"></div>
</article>

<!-- CHAPTER DRAWER — persistent navigator, reachable from the reader -->
<div class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer__scrim" id="drawerScrim"></div>
  <aside class="drawer__panel" role="dialog" aria-label="Chapters" aria-modal="true">
    <div class="drawer__head">
      <span class="drawer__label">Chapters</span>
      <button class="drawer__close" id="closeDrawer" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <label class="drawer__search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="drawerSearch" placeholder="Find a chapter…" aria-label="Find a chapter">
    </label>
    <nav class="drawer__list" id="drawerList"></nav>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
